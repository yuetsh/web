services:
  webpreview-web:
    image: caddy:alpine
    container_name: webpreview-web
    volumes:
      - ./build:/usr/share/caddy:ro
      - ./media:/media
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - 8081:80
    depends_on:
      - webpreview-api
    restart: unless-stopped

  webpreview-api:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: webpreview-api
    env_file:
      - .env
    volumes:
      - ./sqlite:/app/data
      - ./media:/app/media
    restart: unless-stopped
